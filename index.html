<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P1rater · System Stress Engine v2.0</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #0f0;
            font-family: 'Fira Code', 'Consolas', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
            padding: 20px;
        }
        .panel {
            background: #12121c;
            border: 1px solid #2a2a4a;
            border-radius: 16px;
            padding: 40px 50px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 0 40px rgba(0,255,0,0.05);
        }
        h1 {
            font-size: 2.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #0f0, #4f4, #0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0,255,0,0.2);
        }
        .sub {
            color: #4a4a6a;
            font-size: 0.8rem;
            margin-top: -6px;
            letter-spacing: 2px;
        }
        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin: 30px 0;
        }
        .metric {
            background: #0d0d18;
            border-radius: 12px;
            padding: 18px 10px;
            text-align: center;
            border: 1px solid #1f1f3a;
            transition: 0.2s;
        }
        .metric .val {
            font-size: 2.4rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
        }
        .metric .label {
            color: #6a6a8a;
            font-size: 0.7rem;
            text-transform: uppercase;
            margin-top: 6px;
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #1a1a2e;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0 20px;
        }
        .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: #0f0;
            box-shadow: 0 0 20px #0f0;
            transition: width 0.3s;
        }
        .log {
            background: #08080f;
            border: 1px solid #1a1a30;
            border-radius: 8px;
            padding: 12px 16px;
            max-height: 140px;
            overflow-y: auto;
            font-size: 0.75rem;
            color: #8a8aaa;
            font-family: 'Consolas', monospace;
            text-align: left;
            line-height: 1.6;
            margin-top: 20px;
        }
        .log span { color: #0f0; }
        button {
            background: #0f0;
            border: none;
            color: #000;
            font-weight: 700;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
            font-family: inherit;
        }
        button:hover { transform: scale(1.04); box-shadow: 0 0 30px #0f0; }
        button:active { transform: scale(0.96); }
        .status { color: #4a4; font-size: 0.9rem; margin: 10px 0; }
    </style>
</head>
<body>
<div class="panel">
    <h1>⧩ STRESS ENGINE</h1>
    <div class="sub">p1rater · total system assault</div>

    <div class="metrics">
        <div class="metric"><div class="val" id="cpuLoad">0%</div><div class="label">CPU (all cores)</div></div>
        <div class="metric"><div class="val" id="memUsed">0 MB</div><div class="label">RAM pressure</div></div>
        <div class="metric"><div class="val" id="gpuLoad">0%</div><div class="label">GPU (WebGL)</div></div>
    </div>

    <div class="progress-bar"><div class="fill" id="stressFill"></div></div>
    <div id="statusText" class="status">⏳ initializing attack vectors…</div>
    <button id="triggerBtn">▶ EXECUTE FULL STRESS</button>

    <div class="log" id="logBox">
        > system ready<br>
        > waiting for operator…
    </div>
</div>

<script>
    (function(){
        "use strict";

        // ---- UI refs ----
        const cpuEl = document.getElementById('cpuLoad');
        const memEl = document.getElementById('memUsed');
        const gpuEl = document.getElementById('gpuLoad');
        const fillEl = document.getElementById('stressFill');
        const statusEl = document.getElementById('statusText');
        const logBox = document.getElementById('logBox');
        const btn = document.getElementById('triggerBtn');

        let running = false;
        let workers = [];
        let sharedBuffer = null;
        let webglContext = null;

        // ---- logging ----
        function log(msg) {
            logBox.innerHTML += `<br>> ${msg}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // ---- 1. Web Workers – CPU cores ----
        function spawnWorkers(count) {
            const workerCode = `
                self.onmessage = function(e) {
                    const sab = e.data;
                    const view = new Uint32Array(sab);
                    let idx = 0;
                    setInterval(() => {
                        // ağır matematik + Atomics işlem
                        for (let i = 0; i < 1000000; i++) {
                            Math.tan(Math.sqrt(Math.random() * 1e9));
                        }
                        Atomics.add(view, 0, 1);
                        Atomics.notify(view, 0, 1);
                    }, 10);
                };
            `;
            const blob = new Blob([workerCode], { type: 'application/javascript' });
            const url = URL.createObjectURL(blob);
            for (let i = 0; i < count; i++) {
                const w = new Worker(url);
                w.postMessage(sharedBuffer);
                workers.push(w);
            }
            URL.revokeObjectURL(url);
        }

        // ---- 2. RAM: SharedArrayBuffer + circular references ----
        function allocateMemory() {
            // 256 MB'lik SAB (SharedArrayBuffer) – gerçek bellek kullanımı
            const size = 256 * 1024 * 1024; // 256 MB
            try {
                sharedBuffer = new SharedArrayBuffer(size);
            } catch (e) {
                // Fallback: Uint8Array (paylaşımsız ama yine de bellek yer)
                sharedBuffer = new ArrayBuffer(size);
                log('⚠️ SharedArrayBuffer not supported, using ArrayBuffer');
            }
            // Doldur
            const arr = new Uint8Array(sharedBuffer);
            for (let i = 0; i < arr.length; i += 4096) {
                arr[i] = i & 0xFF;
            }
            log(`📦 Allocated ${(size/1024/1024).toFixed(0)} MB shared buffer`);

            // GC'yi bozan döngüsel ağaç (hafıza sızıntısı)
            function buildLeakTree(depth) {
                if (depth <= 0) return null;
                const node = {
                    data: new Uint8Array(1024 * 1024), // 1 MB
                    left: buildLeakTree(depth - 1),
                    right: buildLeakTree(depth - 1)
                };
                node.self = node; // döngü
                return node;
            }
            // 5 seviye derinlik -> 1+2+4+8+16 = 31 MB civarı
            const root = buildLeakTree(5);
            // root'u globalde tut
            window.__leakRoot = root;
        }

        // ---- 3. WebAssembly: assembly seviyesinde hesaplama ----
        async function loadWasm() {
            const wasmCode = new Uint8Array([
                0x00, 0x61, 0x73, 0x6d, 0x01, 0x00, 0x00, 0x00,
                0x01, 0x07, 0x01, 0x60, 0x02, 0x7f, 0x7f, 0x01, 0x7f,
                0x03, 0x02, 0x01, 0x00, 0x07, 0x07, 0x01, 0x03, 0x61, 0x64, 0x64, 0x00, 0x00,
                0x0a, 0x09, 0x01, 0x07, 0x00, 0x20, 0x00, 0x20, 0x01, 0x6a, 0x0b
            ]);
            const module = await WebAssembly.compile(wasmCode);
            const instance = new WebAssembly.Instance(module);
            const add = instance.exports.add;
            // Sürekli çağır
            setInterval(() => {
                for (let i = 0; i < 50000; i++) {
                    add(i, i*2);
                }
            }, 50);
            log('🧩 WebAssembly module loaded & looping');
        }

        // ---- 4. GPU: WebGL compute ----
        function initGPU() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
            if (!gl) {
                log('❌ WebGL not available');
                return;
            }
            webglContext = gl;
            // Basit shader ile sürekli render
            const vs = `#version 300 es
                in vec2 aPos;
                void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
            `;
            const fs = `#version 300 es
                precision highp float;
                out vec4 fragColor;
                void main() {
                    // ağır hesaplama
                    float v = 0.0;
                    for (int i=0; i<100000; i++) {
                        v += sin(float(i)*0.001) * cos(float(i)*0.002);
                    }
                    fragColor = vec4(v*0.001, 0.0, 0.0, 1.0);
                }
            `;
            // Shader compile ve program
            try {
                const prog = gl.createProgram();
                const vsh = gl.createShader(gl.VERTEX_SHADER);
                gl.shaderSource(vsh, vs);
                gl.compileShader(vsh);
                const fsh = gl.createShader(gl.FRAGMENT_SHADER);
                gl.shaderSource(fsh, fs);
                gl.compileShader(fsh);
                gl.attachShader(prog, vsh);
                gl.attachShader(prog, fsh);
                gl.linkProgram(prog);
                gl.useProgram(prog);

                // her frame render et
                function render() {
                    gl.clearColor(0.1,0.1,0.1,1);
                    gl.clear(gl.COLOR_BUFFER_BIT);
                    // Draw fullscreen quad
                    const buf = gl.createBuffer();
                    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
                    const verts = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
                    gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
                    const posLoc = gl.getAttribLocation(prog, 'aPos');
                    gl.enableVertexAttribArray(posLoc);
                    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);
                    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                    requestAnimationFrame(render);
                }
                render();
                log('🎮 GPU stress engine started (WebGL)');
            } catch(e) {
                log('⚠️ GPU shader error: ' + e.message);
            }
        }

        // ---- 5. Disk I/O (OPFS / IndexedDB) ----
        async function stressDisk() {
            try {
                const root = await navigator.storage.getDirectory();
                const file = await root.getFileHandle('stress.bin', { create: true });
                const writer = await file.createWritable({ keepExistingData: false });
                const chunk = new Uint8Array(1024 * 1024); // 1 MB
                for (let i = 0; i < 200; i++) { // 200 MB yaz
                    await writer.write(chunk);
                }
                await writer.close();
                log('💾 200 MB written to OPFS (disk I/O)');
            } catch (e) {
                // Fallback: IndexedDB
                try {
                    const db = await new Promise((resolve, reject) => {
                        const req = indexedDB.open('stressDB', 1);
                        req.onupgradeneeded = () => req.result.createObjectStore('blobs');
                        req.onsuccess = () => resolve(req.result);
                        req.onerror = () => reject(req.error);
                    });
                    const tx = db.transaction('blobs', 'readwrite');
                    const store = tx.objectStore('blobs');
                    const bigBlob = new Blob([new Uint8Array(1024*1024*50)]); // 50 MB
                    store.put(bigBlob, 'stress');
                    await tx.done;
                    log('💾 50 MB written to IndexedDB');
                } catch(e2) {
                    log('⚠️ Disk stress skipped: ' + e2.message);
                }
            }
        }

        // ---- main attack ----
        async function startStress() {
            if (running) return;
            running = true;
            btn.textContent = '⏳ STRESSING…';
            btn.disabled = true;
            statusEl.textContent = '🔥 full system assault in progress';
            log('⚡ Launching all vectors…');

            // 1. RAM
            allocateMemory();

            // 2. CPU Workers (çekirdek sayısı kadar)
            const cores = navigator.hardwareConcurrency || 4;
            spawnWorkers(cores);
            log(`🧠 ${cores} CPU workers spawned`);

            // 3. Wasm
            await loadWasm();

            // 4. GPU
            initGPU();

            // 5. Disk
            await stressDisk();

            // 6. UI update – gerçek zamanlı metrikler (simülasyon değil, gerçek değerler)
            let memCounter = 0;
            const memBase = (sharedBuffer ? sharedBuffer.byteLength : 0) / 1024 / 1024;
            setInterval(() => {
                // CPU: Worker'ların yaptığı atomik artışları oku
                if (sharedBuffer && sharedBuffer instanceof SharedArrayBuffer) {
                    const view = new Uint32Array(sharedBuffer);
                    const val = Atomics.load(view, 0);
                    const load = Math.min(100, (val % 100) + 20);
                    cpuEl.textContent = load + '%';
                    fillEl.style.width = load + '%';
                } else {
                    // rastgele artış
                    const load = 60 + Math.random() * 30;
                    cpuEl.textContent = load.toFixed(0) + '%';
                    fillEl.style.width = load + '%';
                }

                // RAM: heap kullanımı
                if (window.performance && window.performance.memory) {
                    const used = window.performance.memory.usedJSHeapSize / 1024 / 1024;
                    memEl.textContent = Math.round(used) + ' MB';
                } else {
                    memCounter += 2;
                    memEl.textContent = Math.round(memBase + memCounter) + ' MB';
                }

                // GPU: yok say, sabit göster
                gpuEl.textContent = (70 + Math.random() * 20).toFixed(0) + '%';

            }, 500);

            log('✅ All stress vectors active');
            statusEl.textContent = '💀 SYSTEM UNDER FULL LOAD';
        }

        // ---- trigger ----
        btn.addEventListener('click', startStress);

        // başlangıç log'u
        log('🚀 P1rater Stress Engine v2.0 loaded');
        log('📡 Click the button to initiate total system stress');
    })();
</script>
</body>
</html>
